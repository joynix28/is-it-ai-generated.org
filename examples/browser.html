<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>is-it-ai-generated — browser example</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 140px; font: inherit; }
    #out { white-space: pre-wrap; background: #f4f6fb; padding: 1rem; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Browser example</h1>
  <p>Everything below runs on this page. No network requests.</p>
  <textarea id="in">In today's fast-paced world, it is important to note that leveraging cutting-edge solutions plays a crucial role.</textarea>
  <p><button id="run">Analyze</button></p>
  <div id="out">—</div>

  <script type="module">
    // Point this at the built engine. In this repo run `npm run build` first.
    import { detectText, countText } from '../public/core/index.js';

    const out = document.getElementById('out');
    document.getElementById('run').addEventListener('click', () => {
      const text = document.getElementById('in').value;
      const r = detectText(text);
      const s = countText(text);
      out.textContent = [
        `score: ${r.score}/100 (${r.verdict})`,
        `confidence: ${Math.round(r.confidence * 100)}%`,
        `language: ${r.language} (${r.languageName})`,
        `words: ${s.words}, sentences: ${s.sentences}`,
        `fingerprint: ${r.fingerprint}`,
        `phrases: ${r.aiPhrases.map((p) => p.phrase).join(', ') || 'none'}`,
      ].join('\n');
    });
  </script>
</body>
</html>
